services:
  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: industrial-ai-object-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-industrial_ai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-industrial_ai_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - industrial_ai_object_storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: industrial-ai-object-storage-init
    depends_on:
      object-storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-industrial_ai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-industrial_ai_change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-documents}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://object-storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"
        mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}"
    restart: "no"

volumes:
  industrial_ai_object_storage_data:
