name: industrial-ai-quality

x-platform-database-environment: &platform-database-environment
  DATABASE_URL: postgresql+psycopg://quality_platform:quality_platform_only@quality-platform-postgres:5432/quality_platform_test
  TEST_DATABASE_URL: postgresql+psycopg://quality_platform:quality_platform_only@quality-platform-postgres:5432/quality_platform_test

x-identity-database-environment: &identity-database-environment
  IDENTITY_DATABASE_URL: postgresql+psycopg://quality_identity:quality_identity_only@quality-identity-postgres:5432/quality_identity_test
  TEST_IDENTITY_DATABASE_URL: postgresql+psycopg://quality_identity:quality_identity_only@quality-identity-postgres:5432/quality_identity_test

x-quality-build: &quality-build
  context: .
  dockerfile: quality-gate/Dockerfile

services:
  quality-platform-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quality_platform
      POSTGRES_PASSWORD: quality_platform_only
      POSTGRES_DB: quality_platform_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality_platform -d quality_platform_test"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - quality-database
    restart: "no"

  quality-identity-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quality_identity
      POSTGRES_PASSWORD: quality_identity_only
      POSTGRES_DB: quality_identity_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality_identity -d quality_identity_test"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - quality-database
    restart: "no"

  quality-platform-migrator:
    image: industrial-ai-quality-api-production:${QUALITY_IMAGE_TAG:-local}
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    environment:
      <<: *platform-database-environment
    command: ["python", "migration_guard.py", "apply"]
    depends_on:
      quality-platform-postgres:
        condition: service_healthy
    networks:
      - quality-database
    restart: "no"

  quality-identity-migrator:
    image: industrial-ai-quality-api-production:${QUALITY_IMAGE_TAG:-local}
    environment:
      <<: *identity-database-environment
    command: ["alembic", "-c", "identity_alembic.ini", "upgrade", "head"]
    depends_on:
      quality-identity-postgres:
        condition: service_healthy
    networks:
      - quality-database
    restart: "no"

  quality-backend:
    build:
      <<: *quality-build
      target: backend
    environment:
      <<: [*platform-database-environment, *identity-database-environment]
      AUTHENTICATION_REQUIRED: "true"
      AUTH_COOKIE_SECURE: "false"
      FEATURE_EMBEDDINGS_ENABLED: "false"
      FEATURE_VECTOR_RETRIEVAL_ENABLED: "false"
      FEATURE_WORKER_ENABLED: "false"
      FEATURE_ENTERPRISE_EXTENSIONS_ENABLED: "false"
      INDUSTRIAL_AI_STORAGE_FILESYSTEM_ROOT: /tmp/industrial-ai-quality-storage
    networks:
      - quality-database
    restart: "no"

  quality-portal:
    build:
      <<: *quality-build
      target: portal
    network_mode: none
    restart: "no"

  quality-npm-audit:
    build:
      <<: *quality-build
      target: portal
    networks:
      - quality-egress
    restart: "no"

  quality-python-audit:
    build:
      <<: *quality-build
      target: backend
    networks:
      - quality-egress
    restart: "no"

  quality-image-contracts:
    build:
      <<: *quality-build
      target: image-contracts
    network_mode: none
    restart: "no"

networks:
  quality-database:
    internal: true
  quality-egress:
