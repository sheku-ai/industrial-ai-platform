name: industrial-ai-platform

x-database-environment: &database-environment
  DATABASE_URL: ${CONTAINER_DATABASE_URL:-postgresql+psycopg://industrial_ai:industrial_ai@postgres:5432/industrial_ai}

x-identity-database-environment: &identity-database-environment
  IDENTITY_DATABASE_URL: ${CONTAINER_IDENTITY_DATABASE_URL:-postgresql+psycopg://industrial_ai_identity:identity_local_only@identity-postgres:5432/industrial_ai_identity}

x-object-storage-environment: &object-storage-environment
  OBJECT_STORAGE_PROVIDER: ${CONTAINER_OBJECT_STORAGE_PROVIDER:-filesystem}
  OBJECT_STORAGE_ENDPOINT_URL: ${CONTAINER_OBJECT_STORAGE_ENDPOINT_URL:-}
  OBJECT_STORAGE_REGION: ${CONTAINER_OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_ACCESS_KEY: ${CONTAINER_OBJECT_STORAGE_ACCESS_KEY:-}
  OBJECT_STORAGE_SECRET_KEY: ${CONTAINER_OBJECT_STORAGE_SECRET_KEY:-}
  OBJECT_STORAGE_BUCKET: ${CONTAINER_OBJECT_STORAGE_BUCKET:-}
  OBJECT_STORAGE_SECURE: ${CONTAINER_OBJECT_STORAGE_SECURE:-false}

x-secret-store-environment: &secret-store-environment
  SECRET_STORE_PROVIDER: ${SECRET_STORE_PROVIDER:-memory}
  SECRET_STORE_REDIS_URL: ${CONTAINER_SECRET_STORE_REDIS_URL:-}
  SECRET_STORE_KEY_PREFIX: ${SECRET_STORE_KEY_PREFIX:-industrial-ai:ephemeral-secret:}
  SECRET_STORE_SOCKET_TIMEOUT_SECONDS: ${SECRET_STORE_SOCKET_TIMEOUT_SECONDS:-3}

x-filesystem-storage-environment: &filesystem-storage-environment
  INDUSTRIAL_AI_STORAGE_FILESYSTEM_ROOT: ${CONTAINER_FILESYSTEM_STORAGE_ROOT:-/runtime/storage/filesystem}

x-api-build: &api-build
  context: ./apps/api
  dockerfile: Dockerfile
  args:
    INSTALL_INTENT_RUNTIME: ${INSTALL_INTENT_RUNTIME:-false}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-industrial_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-industrial_ai}
      POSTGRES_DB: ${POSTGRES_DB:-industrial_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  identity-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER:-industrial_ai_identity}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:-identity_local_only}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-industrial_ai_identity}
    ports:
      - "${IDENTITY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    profiles: ["ingestion"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrator:
    build: *api-build
    environment:
      <<: *database-environment
    command: ["python", "migration_guard.py", "apply"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  identity-migrator:
    build: *api-build
    environment:
      <<: *identity-database-environment
    command: ["alembic", "-c", "identity_alembic.ini", "upgrade", "head"]
    depends_on:
      identity-postgres:
        condition: service_healthy
    restart: "no"

  filesystem-storage-init:
    image: alpine:3.21
    user: root
    command: ["sh", "-c", "mkdir -p /storage && chown -R 10001:10001 /storage"]
    volumes:
      - filesystem_storage_data:/storage
    restart: "no"

  api:
    build: *api-build
    environment:
      <<: [*database-environment, *identity-database-environment, *object-storage-environment, *secret-store-environment, *filesystem-storage-environment]
      AUTHENTICATION_REQUIRED: ${AUTHENTICATION_REQUIRED:-true}
      SHEKU_SETUP_TOKEN: ${SHEKU_SETUP_TOKEN:-}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-industrial_ai_session}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_ABSOLUTE_SECONDS: ${AUTH_SESSION_ABSOLUTE_SECONDS:-43200}
      AUTH_SESSION_INACTIVITY_SECONDS: ${AUTH_SESSION_INACTIVITY_SECONDS:-3600}
      AUTH_SESSION_TOUCH_INTERVAL_SECONDS: ${AUTH_SESSION_TOUCH_INTERVAL_SECONDS:-300}
      AUTH_PASSWORD_MIN_LENGTH: ${AUTH_PASSWORD_MIN_LENGTH:-15}
      AUTH_PASSWORD_MAX_LENGTH: ${AUTH_PASSWORD_MAX_LENGTH:-128}
      AUTH_PASSWORD_BLOCK_CONTEXT: ${AUTH_PASSWORD_BLOCK_CONTEXT:-true}
      AUTH_PASSWORD_BLOCK_COMMON: ${AUTH_PASSWORD_BLOCK_COMMON:-true}
      AUTH_CSRF_HEADER_NAME: ${AUTH_CSRF_HEADER_NAME:-X-CSRF-Token}
      AUTH_TRUSTED_PROXY_NETWORKS: ${AUTH_TRUSTED_PROXY_NETWORKS:-}
      AUTH_FORWARDED_IP_HEADERS: ${AUTH_FORWARDED_IP_HEADERS:-forwarded,x-forwarded-for}
      PORTAL_PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CONTAINER_CORS_ALLOWED_ORIGINS:-}
      FEATURE_EMBEDDINGS_ENABLED: ${FEATURE_EMBEDDINGS_ENABLED:-false}
      FEATURE_VECTOR_RETRIEVAL_ENABLED: ${FEATURE_VECTOR_RETRIEVAL_ENABLED:-false}
      FEATURE_WORKER_ENABLED: ${FEATURE_WORKER_ENABLED:-false}
      FEATURE_ENTERPRISE_EXTENSIONS_ENABLED: ${FEATURE_ENTERPRISE_EXTENSIONS_ENABLED:-false}
      OLLAMA_BASE_URL: ${CONTAINER_OLLAMA_BASE_URL:-http://ollama:11434}
      BUILD_COMMIT: ${BUILD_COMMIT:-container}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-30}
      DEPENDENCY_PROBE_TIMEOUT_SECONDS: ${DEPENDENCY_PROBE_TIMEOUT_SECONDS:-2}
      STARTUP_DEPENDENCY_MAX_ATTEMPTS: ${STARTUP_DEPENDENCY_MAX_ATTEMPTS:-12}
      STARTUP_DEPENDENCY_RETRY_SECONDS: ${STARTUP_DEPENDENCY_RETRY_SECONDS:-2}
    ports:
      - "8000:8000"
    volumes:
      - ./runtime:/runtime
      - filesystem_storage_data:${CONTAINER_FILESYSTEM_STORAGE_ROOT:-/runtime/storage/filesystem}
    depends_on:
      migrator:
        condition: service_completed_successfully
      identity-migrator:
        condition: service_completed_successfully
      filesystem-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  scheduler:
    build: *api-build
    environment:
      <<: *database-environment
      SCHEDULER_POLL_INTERVAL_SECONDS: ${SCHEDULER_POLL_INTERVAL_SECONDS:-5}
      SCHEDULER_BATCH_LIMIT: ${SCHEDULER_BATCH_LIMIT:-100}
      SCHEDULER_OWNER_ID: ${SCHEDULER_OWNER_ID:-scheduler-container}
      SCHEDULER_HEALTH_HEARTBEAT_STALE_SECONDS: ${SCHEDULER_HEALTH_HEARTBEAT_STALE_SECONDS:-30}
      SCHEDULER_HEALTH_CYCLE_STALE_SECONDS: ${SCHEDULER_HEALTH_CYCLE_STALE_SECONDS:-60}
    command: ["python", "scheduler_worker.py"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "scheduler_healthcheck.py"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_BASE_URL: ${PORTAL_API_INTERNAL_BASE_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/operations').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    profiles: ["object-storage", "ingestion"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    profiles: ["object-storage", "ingestion"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-industrial-ai-smoke}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set platform http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "platform/$${OBJECT_STORAGE_BUCKET}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ingestion-worker:
    build: *api-build
    profiles: ["ingestion"]
    environment:
      <<: [*database-environment, *object-storage-environment, *secret-store-environment, *filesystem-storage-environment]
      WORKER_ID: ${WORKER_ID:-container-ingestion-worker}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      WORKER_EXECUTION_TYPE: ${WORKER_EXECUTION_TYPE:-document.ingestion}
      WORKER_QUEUE_KEY: ${WORKER_QUEUE_KEY:-platform-default}
      WORKER_ACCEPTED_QUEUE_KEYS: ${WORKER_ACCEPTED_QUEUE_KEYS:-}
      WORKER_QUEUE_CANDIDATE_LIMIT: ${WORKER_QUEUE_CANDIDATE_LIMIT:-100}
      WORKER_HEAVY_BYTES_THRESHOLD: ${WORKER_HEAVY_BYTES_THRESHOLD:-100000000}
      WORKER_HEAVY_PAGES_THRESHOLD: ${WORKER_HEAVY_PAGES_THRESHOLD:-500}
      WORKER_MAX_CONSECUTIVE_HEAVY: ${WORKER_MAX_CONSECUTIVE_HEAVY:-1}
      DOCUMENT_INGESTION_ADAPTER_FACTORY: ${DOCUMENT_INGESTION_ADAPTER_FACTORY:-}
    volumes:
      - filesystem_storage_data:${CONTAINER_FILESYSTEM_STORAGE_ROOT:-/runtime/storage/filesystem}
    command: ["python", "-m", "app.workers.runtime_controlled_ingestion_worker"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      filesystem-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-monitor:
    build: *api-build
    profiles: ["ingestion"]
    environment:
      <<: *database-environment
      PYTHONPATH: /app
      WORKER_MONITOR_ID: ${WORKER_MONITOR_ID:-platform-worker-monitor}
      WORKER_MONITOR_INTERVAL_SECONDS: ${WORKER_MONITOR_INTERVAL_SECONDS:-10}
      WORKER_MONITOR_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_MONITOR_HEARTBEAT_INTERVAL_SECONDS:-10}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-30}
      WORKER_MONITOR_BATCH_LIMIT: ${WORKER_MONITOR_BATCH_LIMIT:-100}
    command: ["python", "-m", "app.workers.runtime_worker_monitor"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python /app/scripts/check_managed_service_health.py --worker-key $${WORKER_MONITOR_ID} --max-age 60"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

  lease-reconciler:
    build: *api-build
    profiles: ["ingestion"]
    environment:
      <<: *database-environment
      PYTHONPATH: /app
      LEASE_RECONCILER_ID: ${LEASE_RECONCILER_ID:-platform-lease-reconciler}
      LEASE_RECONCILER_INTERVAL_SECONDS: ${LEASE_RECONCILER_INTERVAL_SECONDS:-10}
      LEASE_RECONCILER_HEARTBEAT_INTERVAL_SECONDS: ${LEASE_RECONCILER_HEARTBEAT_INTERVAL_SECONDS:-10}
      LEASE_RECONCILER_BATCH_LIMIT: ${LEASE_RECONCILER_BATCH_LIMIT:-100}
      LEASE_RECONCILER_DEFAULT_MAX_ATTEMPTS: ${LEASE_RECONCILER_DEFAULT_MAX_ATTEMPTS:-3}
      LEASE_RECONCILER_DEFAULT_RETRY_DELAY_SECONDS: ${LEASE_RECONCILER_DEFAULT_RETRY_DELAY_SECONDS:-0}
    command: ["python", "-m", "app.workers.runtime_lease_reconciler"]
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python /app/scripts/check_managed_service_health.py --worker-key $${LEASE_RECONCILER_ID} --max-age 60"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  identity_postgres_data:
  filesystem_storage_data:
  minio_data:
  ollama_data:
