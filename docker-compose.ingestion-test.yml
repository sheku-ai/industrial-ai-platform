services:
  redis-test:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-test:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${TEST_MINIO_ACCESS_KEY:?TEST_MINIO_ACCESS_KEY is required}"
      MINIO_ROOT_PASSWORD: "${TEST_MINIO_SECRET_KEY:?TEST_MINIO_SECRET_KEY is required}"
    tmpfs:
      - /data

  api-test:
    environment:
      OBJECT_STORAGE_ENDPOINT_URL: "http://minio-test:9000"
      OBJECT_STORAGE_REGION: "us-east-1"
      OBJECT_STORAGE_ACCESS_KEY: "${TEST_MINIO_ACCESS_KEY:?TEST_MINIO_ACCESS_KEY is required}"
      OBJECT_STORAGE_SECRET_KEY: "${TEST_MINIO_SECRET_KEY:?TEST_MINIO_SECRET_KEY is required}"
      OBJECT_STORAGE_BUCKET: "industrial-ai-test"
      OBJECT_STORAGE_SECURE: "false"
      SECRET_STORE_PROVIDER: "redis"
      SECRET_STORE_REDIS_URL: "redis://redis-test:6379/0"
      SECRET_STORE_KEY_PREFIX: "industrial-ai:test:ephemeral-secret:"
      SECRET_STORE_SOCKET_TIMEOUT_SECONDS: "3"
      SMOKE_API_BASE_URL: "http://api-server-test:8000/api"
    depends_on:
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_started

  api-server-test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://industrial_ai:industrial_ai@postgres-test:5432/industrial_ai_test"
      PYTHONPATH: "/app"
      FEATURE_EMBEDDINGS_ENABLED: "false"
      FEATURE_VECTOR_RETRIEVAL_ENABLED: "false"
      FEATURE_WORKER_ENABLED: "false"
      FEATURE_ENTERPRISE_EXTENSIONS_ENABLED: "false"
      OBJECT_STORAGE_ENDPOINT_URL: "http://minio-test:9000"
      OBJECT_STORAGE_REGION: "us-east-1"
      OBJECT_STORAGE_ACCESS_KEY: "${TEST_MINIO_ACCESS_KEY:?TEST_MINIO_ACCESS_KEY is required}"
      OBJECT_STORAGE_SECRET_KEY: "${TEST_MINIO_SECRET_KEY:?TEST_MINIO_SECRET_KEY is required}"
      OBJECT_STORAGE_BUCKET: "industrial-ai-test"
      OBJECT_STORAGE_SECURE: "false"
      SECRET_STORE_PROVIDER: "redis"
      SECRET_STORE_REDIS_URL: "redis://redis-test:6379/0"
      SECRET_STORE_KEY_PREFIX: "industrial-ai:test:ephemeral-secret:"
      SECRET_STORE_SOCKET_TIMEOUT_SECONDS: "3"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrator-test:
        condition: service_completed_successfully
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3).read()"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: "no"

  ingestion-worker-test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql+psycopg://industrial_ai:industrial_ai@postgres-test:5432/industrial_ai_test"
      PYTHONPATH: "/app"
      OBJECT_STORAGE_ENDPOINT_URL: "http://minio-test:9000"
      OBJECT_STORAGE_REGION: "us-east-1"
      OBJECT_STORAGE_ACCESS_KEY: "${TEST_MINIO_ACCESS_KEY:?TEST_MINIO_ACCESS_KEY is required}"
      OBJECT_STORAGE_SECRET_KEY: "${TEST_MINIO_SECRET_KEY:?TEST_MINIO_SECRET_KEY is required}"
      OBJECT_STORAGE_BUCKET: "industrial-ai-test"
      OBJECT_STORAGE_SECURE: "false"
      SECRET_STORE_PROVIDER: "redis"
      SECRET_STORE_REDIS_URL: "redis://redis-test:6379/0"
      SECRET_STORE_KEY_PREFIX: "industrial-ai:test:ephemeral-secret:"
      SECRET_STORE_SOCKET_TIMEOUT_SECONDS: "3"
      WORKER_ID: "isolated-ingestion-worker"
      WORKER_POLL_INTERVAL_SECONDS: "1"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "2"
      WORKER_EXECUTION_TYPE: "document.ingestion"
      WORKER_QUEUE_KEY: "platform-default"
      WORKER_ACCEPTED_QUEUE_KEYS: ""
      WORKER_QUEUE_CANDIDATE_LIMIT: "100"
      WORKER_HEAVY_BYTES_THRESHOLD: "100000000"
      WORKER_HEAVY_PAGES_THRESHOLD: "500"
      WORKER_MAX_CONSECUTIVE_HEAVY: "1"
      DOCUMENT_INGESTION_ADAPTER_FACTORY: ""
    command: ["python", "-m", "app.workers.runtime_controlled_ingestion_worker"]
    depends_on:
      migrator-test:
        condition: service_completed_successfully
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_started
    restart: "no"
