[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["apps/api/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["apps/api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
