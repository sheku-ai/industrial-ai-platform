name: SHEKU Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Unit tests
        run: python -m pytest
      - name: Ruff lint
        run: python -m ruff check apps/api/app/core apps/api/app/security apps/api/app/repositories/scoped.py apps/api/app/db/unit_of_work.py tests
      - name: Ruff format
        run: python -m ruff format --check apps/api/app/core apps/api/app/security apps/api/app/repositories/scoped.py apps/api/app/db/unit_of_work.py tests
      - name: Mypy
        run: python -m mypy apps/api/app/core apps/api/app/security apps/api/app/repositories/scoped.py apps/api/app/db/unit_of_work.py
      - name: Bandit
        run: python -m bandit -q -r apps/api/app/core apps/api/app/security apps/api/app/repositories/scoped.py apps/api/app/db/unit_of_work.py

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: industrial_ai
          POSTGRES_PASSWORD: industrial_ai
          POSTGRES_DB: industrial_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U industrial_ai -d industrial_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Validate Alembic migration chain
        env:
          MIGRATION_VALIDATION_ADMIN_URL: postgresql://industrial_ai:industrial_ai@localhost:5432/postgres
        run: python scripts/smoke_migration_validation.py

  portal-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install portal dependencies
        run: npm install
      - name: Build portal
        run: npm run build
